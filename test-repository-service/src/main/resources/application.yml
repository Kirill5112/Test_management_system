server:
  port: 8081

spring:
  application:
    name: test-repository-service

  datasource:
    url: jdbc:postgresql://localhost:5432/tms
    username: tms
    password: tms
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: test_repository
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
#      default_schema: test_repository
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    schemas: test_repository
    default-schema: test_repository
    baseline-on-migrate: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: test-repository-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.example.tms.*"

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: INFO