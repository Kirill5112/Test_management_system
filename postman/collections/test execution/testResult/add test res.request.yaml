$kind: http-request
url: '{{gateway}}/api/execution/test-results'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: "{\r

    \    \"testRunId\": \"{{testRunId}}\",\r

    \    \"testCaseId\": \"{{$randomUUID}}\",\r

    \    \"status\": \"PASSED\",\r

    \    \"executedById\": \"{{userId}}\"\r

    }"
order: 1000
