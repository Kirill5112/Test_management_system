server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
#      routes:
#        - id: test-repository-service
#          uri: lb://test-repository-service
#          predicates:
#            - Path=/api/repository/**
#          filters:
#            - StripPrefix=2
#        - id: test-execution-service
#          uri: lb://test-execution-service
#          predicates:
#            - Path=/api/execution/**
#          filters:
#            - StripPrefix=2
      server:
        webmvc:
          routes:
            - id: test-repository-service
              uri: lb://test-repository-service
              predicates:
                - Path=/api/repository/**
              filters:
                - StripPrefix=2
            - id: test-execution-service
              uri: lb://test-execution-service
              predicates:
                - Path=/api/execution/**
              filters:
                - StripPrefix=2

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway